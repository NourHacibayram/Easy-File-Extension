<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a file</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <main class="picker-shell" aria-labelledby="picker-title" aria-describedby="picker-subtitle">
    <header class="picker-header">
      <div class="picker-brand">
        <span class="brand-mark" aria-hidden="true">
          <img src="icons/icon32.png" alt="" width="22" height="22">
        </span>
        <div class="brand-copy">
          <h1 id="picker-title">Choose a file</h1>
          <p id="picker-subtitle">Select an item below to attach it instantly</p>
        </div>
      </div>

      <div class="header-actions">
        <button id="show-all" class="show-all" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.75 7.5h5l1.5 2h10v8.25A2.25 2.25 0 0 1 18 20H6a2.25 2.25 0 0 1-2.25-2.25V7.5Z"/>
            <path d="M3.75 7.5V6.25A2.25 2.25 0 0 1 6 4h3l1.5 2h5.75A2.25 2.25 0 0 1 18.5 8.25V9.5"/>
          </svg>
          <span>Browse files</span>
        </button>
        <button id="close-picker" class="icon-button close-button" type="button" aria-label="Close picker" title="Close picker" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 7 10 10M17 7 7 17"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="source-tabs" aria-label="File source" role="tablist">
      <button id="source-clipboard" class="source-tab" type="button" role="tab" aria-selected="true" aria-controls="clipboard-section">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5.5h6M8.5 7H7.25A2.25 2.25 0 0 0 5 9.25v9.5A2.25 2.25 0 0 0 7.25 21h9.5A2.25 2.25 0 0 0 19 18.75v-9.5A2.25 2.25 0 0 0 16.75 7H15.5V5A1.5 1.5 0 0 0 14 3.5h-4A1.5 1.5 0 0 0 8.5 5v2Z"/></svg>
        <span>Clipboard</span>
        <span id="clipboard-tab-count" class="tab-count">0</span>
      </button>
      <button id="source-downloads" class="source-tab" type="button" role="tab" aria-selected="false" aria-controls="downloads-section" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.75v10.5m0 0 4-4m-4 4-4-4M5 18.25v1.25h14v-1.25"/></svg>
        <span>Downloads</span>
        <span id="downloads-tab-count" class="tab-count">0</span>
      </button>
      <button id="source-protected" class="source-tab" type="button" role="tab" aria-selected="false" aria-controls="hidden-section" tabindex="-1">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 19 6v5.25c0 4.45-2.8 7.5-7 9.25-4.2-1.75-7-4.8-7-9.25V6l7-2.5Z"/><path d="m9.25 12 1.75 1.75 3.75-4"/></svg>
        <span>Protected</span>
        <span id="hidden-count" class="tab-count">0</span>
      </button>
    </nav>

    <div id="picker-body" class="picker-body">
      <div id="migration-status" class="migration-status" role="status" aria-live="polite" hidden></div>

      <section id="clipboard-section" class="source-section clipboard-section" aria-labelledby="clipboard-title" role="tabpanel" aria-describedby="clipboard-title">
        <div class="section-heading">
          <div>
            <h2 id="clipboard-title" class="section-title">
              <span class="section-icon clipboard-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M9 5.5h6M8.5 7H7.25A2.25 2.25 0 0 0 5 9.25v9.5A2.25 2.25 0 0 0 7.25 21h9.5A2.25 2.25 0 0 0 19 18.75v-9.5A2.25 2.25 0 0 0 16.75 7H15.5V5A1.5 1.5 0 0 0 14 3.5h-4A1.5 1.5 0 0 0 8.5 5v2Z"/></svg>
              </span>
              Clipboard
              <span id="clipboard-count" class="section-count">0</span>
            </h2>
            <p class="section-description">Recently copied images</p>
          </div>
          <span class="source-hint">Click to attach</span>
        </div>
        <div id="clipboard-grid" class="items-grid" aria-live="polite"></div>
      </section>

      <section id="downloads-section" class="source-section downloads-section" aria-labelledby="downloads-title" role="tabpanel" aria-describedby="downloads-title" hidden>
        <div class="section-heading">
          <div>
            <h2 id="downloads-title" class="section-title">
              <span class="section-icon downloads-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3.75v10.5m0 0 4-4m-4 4-4-4M5 18.25v1.25h14v-1.25"/></svg>
              </span>
              Downloads
              <span id="downloads-count" class="section-count">0</span>
            </h2>
            <p class="section-description">Files downloaded recently</p>
          </div>
        </div>
        <div id="downloads-grid" class="items-grid" aria-live="polite"></div>
      </section>

      <section id="hidden-section" class="source-section hidden-section" aria-labelledby="hidden-title" role="tabpanel" aria-describedby="hidden-title" hidden>
        <div class="section-heading">
          <div>
            <h2 id="hidden-title" class="section-title hidden-title">
              <span class="section-icon protected-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3.5 19 6v5.25c0 4.45-2.8 7.5-7 9.25-4.2-1.75-7-4.8-7-9.25V6l7-2.5Z"/><path d="m9.25 12 1.75 1.75 3.75-4"/></svg>
              </span>
              Protected
              <span id="hidden-section-count" class="section-count">0</span>
            </h2>
            <p class="section-description">Saved items that never expire</p>
          </div>
          <span class="protected-note">Private to this device</span>
        </div>
        <div id="hidden-grid" class="items-grid" aria-live="polite"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="picker.js"></script>
</body>
</html>
