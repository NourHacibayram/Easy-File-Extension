<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipboard and downloads picker</title>
  <link rel="stylesheet" href="picker.css">
</head>
<body>
  <main class="picker-shell" aria-label="Clipboard and downloads picker">
    <header class="picker-header">
      <button id="show-all" class="show-all" type="button">Show all files</button>
      <div class="header-actions">
        <button id="toggle-hidden" class="icon-button hidden-toggle" type="button" aria-expanded="false" aria-controls="hidden-section" title="Show hidden images">
          <span aria-hidden="true">Hidden</span>
          <span id="hidden-count" class="count-badge">0</span>
        </button>
        <button id="close-picker" class="icon-button close-button" type="button" aria-label="Close picker" title="Close">&#10005;</button>
      </div>
    </header>

    <div id="picker-body" class="picker-body">
      <div id="migration-status" class="migration-status" role="status" aria-live="polite" hidden></div>

      <section aria-labelledby="clipboard-title">
        <h2 id="clipboard-title" class="section-title">Clipboard <span id="clipboard-count">0</span></h2>
        <div id="clipboard-grid" class="items-grid" aria-live="polite"></div>
      </section>

      <section aria-labelledby="downloads-title">
        <h2 id="downloads-title" class="section-title">Downloaded <span id="downloads-count">0</span></h2>
        <div id="downloads-grid" class="items-grid" aria-live="polite"></div>
      </section>

      <section id="hidden-section" class="hidden-section" aria-labelledby="hidden-title" hidden>
        <h2 id="hidden-title" class="section-title hidden-title">Hidden <span id="hidden-section-count">0</span></h2>
        <div id="hidden-grid" class="items-grid" aria-live="polite"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="picker.js"></script>
</body>
</html>
